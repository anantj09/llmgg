# Continuous integration: runs on every pull request to main, and is reused
# by the CD and Release workflows so nothing ships without passing it.
name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Run tests with coverage
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml
      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  benchmark:
    name: Guardrail benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt
      - name: Run benchmark
        run: |
          python scripts/run_eval.py | tee eval.txt
          {
            echo "## Guardrail benchmark"
            echo '```'
            cat eval.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: llm-guardrail-gateway:ci
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start container
        run: |
          docker run -d --name gateway -p 8000:8000 \
            -e PROVIDER=mock -e GATEWAY_API_KEYS=ci-test-key \
            llm-guardrail-gateway:ci
      - name: Smoke test the running container
        run: |
          python3 scripts/smoke_test.py --url http://localhost:8000 \
            --key ci-test-key --expect-commit ${{ github.sha }} --wait 60
      - name: Show container logs
        if: always()
        run: docker logs gateway
